<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2K CAM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #0d0d0d; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
        }

        .container {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 900px; padding: 20px;
        }

        h1 {
            font-size: 1.8rem; font-weight: 600; letter-spacing: 3px;
            margin-bottom: 20px; color: #ff8c00; text-shadow: 0 0 10px rgba(255,140,0,0.5);
        }

        #webcam, #hiddenCanvas { display: none; }

        /* 預覽容器：外框與相機預覽 */
        .preview-box {
            position: relative;
            border: 2px solid #333; border-radius: 8px;
            overflow: hidden; background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            max-width: 100%;
        }

        /* ASCII 畫面區域 */
        #asciiWrapper {
            position: relative;
            background: #000;
            padding: 15px;
            display: block;
        }

        #asciiOutput {
            font-family: "Courier New", Courier, monospace;
            white-space: pre; 
            line-height: 0.65; 
            font-size: 8px; 
            letter-spacing: 0px; 
            color: #00ff66; 
            margin: 0; 
            font-weight: bold; 
            user-select: none;
            text-align: center;
        }

        /* Y2K 時間戳記 overlay */
        .timestamp-stamp {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 18px;
            color: #ff8c00;
            text-shadow: 0 0 4px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        /* GameBoy 模式畫布 */
        #pixelCanvas {
            display: none;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        .controls {
            margin-top: 25px; display: flex; gap: 15px;
            flex-wrap: wrap; justify-content: center; align-items: center;
        }

        .btn {
            background: #1a1a1a; border: 1px solid #444; color: #ccc;
            padding: 10px 20px; font-size: 0.9rem; cursor: pointer;
            border-radius: 4px; transition: all 0.2s ease;
        }
        .btn:hover { background: #333; color: #fff; border-color: #666; }
        .btn.active { background: #ff8c00; color: #000; border-color: #ff8c00; font-weight: bold; }

        .flash { animation: flashAnim 0.2s ease-out; }
        @keyframes flashAnim {
            0% { opacity: 0.3; background: white; }
            100% { opacity: 1; }
        }
    </style>
    <!-- 引入 html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Y2K CAM</h1>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="hiddenCanvas"></canvas>

        <div class="preview-box" id="previewBox">
            <div id="asciiWrapper">
                <pre id="asciiOutput"></pre>
                <div class="timestamp-stamp" id="asciiStamp"></div>
            </div>
            <canvas id="pixelCanvas"></canvas>
        </div>

        <div class="controls">
            <button class="btn active" id="btnAscii" onclick="setMode('ascii')">ASCII</button>
            <button class="btn" id="btnGameboy" onclick="setMode('gameboy')">GameBoy</button>
            <button class="btn" onclick="takeSnapshot()">📷 拍照下載</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        
        const asciiWrapper = document.getElementById('asciiWrapper');
        const asciiOutput = document.getElementById('asciiOutput');
        const asciiStamp = document.getElementById('asciiStamp');
        const pixelCanvas = document.getElementById('pixelCanvas');
        const pixelCtx = pixelCanvas.getContext('2d');

        let currentMode = 'ascii';
        
        const asciiChars = ' .`^\",:;Il!i~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
        
        const gbPalette = [
            [15, 56, 15],     
            [48, 98, 48],     
            [139, 172, 15],   
            [155, 188, 15]    
        ];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                
                setMode('ascii');
                requestAnimationFrame(processFrame);
            } catch (err) {
                console.error(err);
                alert("無法存取攝影機，請授權攝影機權限。");
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnAscii').classList.toggle('active', mode === 'ascii');
            document.getElementById('btnGameboy').classList.toggle('active', mode === 'gameboy');

            if (mode === 'ascii') {
                asciiWrapper.style.display = 'block';
                pixelCanvas.style.display = 'none';
            } else {
                asciiWrapper.style.display = 'none';
                pixelCanvas.style.display = 'block';
            }
        }

        function processFrame() {
            if (video.paused || video.ended) return;

            const videoAspect = video.videoHeight / video.videoWidth;

            if (currentMode === 'ascii') {
                const cols = 120;
                const rows = Math.floor(cols * videoAspect * 0.95);

                hiddenCanvas.width = cols;
                hiddenCanvas.height = rows;

                hiddenCtx.save();
                hiddenCtx.scale(-1, 1);
                hiddenCtx.drawImage(video, -cols, 0, cols, rows);
                hiddenCtx.restore();

                const imgData = hiddenCtx.getImageData(0, 0, cols, rows);
                renderAscii(imgData.data, cols, rows);
                updateY2KStampText(asciiStamp);
            } else {
                const cols = 160;
                const rows = Math.floor(cols * videoAspect);

                hiddenCanvas.width = cols;
                hiddenCanvas.height = rows;

                hiddenCtx.save();
                hiddenCtx.scale(-1, 1);
                hiddenCtx.drawImage(video, -cols, 0, cols, rows);
                hiddenCtx.restore();

                const imgData = hiddenCtx.getImageData(0, 0, cols, rows);
                renderGameboy(imgData.data, cols, rows);
            }

            requestAnimationFrame(processFrame);
        }

        function renderAscii(pixels, cols, rows) {
            let result = '';
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const idx = (y * cols + x) * 4;
                    const brightness = 0.299 * pixels[idx] + 0.587 * pixels[idx + 1] + 0.114 * pixels[idx + 2];
                    const charIdx = Math.floor((brightness / 255) * (asciiChars.length - 1));
                    result += asciiChars[charIdx];
                }
                result += '\n';
            }
            asciiOutput.textContent = result;
        }

        function renderGameboy(pixels, cols, rows) {
            const scale = 4;
            pixelCanvas.width = cols * scale;
            pixelCanvas.height = rows * scale;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const idx = (y * cols + x) * 4;
                    const brightness = 0.299 * pixels[idx] + 0.587 * pixels[idx + 1] + 0.114 * pixels[idx + 2];
                    const colorIdx = Math.floor((brightness / 255) * 3.99);
                    const [gr, gg, gb] = gbPalette[colorIdx];

                    pixelCtx.fillStyle = `rgb(${gr},${gg},${gb})`;
                    pixelCtx.fillRect(x * scale, y * scale, scale, scale);
                }
            }

            drawY2KStampOnCanvas(pixelCtx, pixelCanvas.width, pixelCanvas.height);
        }

        function getY2KTimeString() {
            const now = new Date();
            const year = String(now.getFullYear()).slice(-2);
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            return `'${year} ${month} ${day}  ${hours}:${mins}`;
        }

        function updateY2KStampText(element) {
            element.textContent = getY2KTimeString();
        }

        function drawY2KStampOnCanvas(ctx, width, height) {
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.fillStyle = '#ff8c00';
            ctx.textAlign = 'right';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(getY2KTimeString(), width - 20, height - 15);
            ctx.shadowBlur = 0;
        }

        // 拍照快照：ASCII 模式
        async function takeSnapshot() {
            const previewBox = document.getElementById('previewBox');
            previewBox.classList.add('flash');
            setTimeout(() => previewBox.classList.remove('flash'), 200);

            if (currentMode === 'ascii') {
                const canvas = await html2canvas(asciiWrapper, {
                    backgroundColor: '#000000',
                    scale: 2 
                });
                
                const link = document.createElement('a');
                link.download = `y2k-cam-ascii-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } else {
                const link = document.createElement('a');
                link.download = `y2k-cam-gb-${Date.now()}.png`;
                link.href = pixelCanvas.toDataURL('image/png');
                link.click();
            }
        }

        initCamera();
    </script>
</body>
</html>
