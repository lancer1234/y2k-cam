<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2K CAM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #0d0d0d; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
        }

        .container {
            display: flex; flex-direction: column; align-items: center;
            max-width: 900px; width: 100%; padding: 20px;
        }

        h1 {
            font-size: 1.8rem; font-weight: 600; letter-spacing: 3px;
            margin-bottom: 20px; color: #ff8c00; text-shadow: 0 0 10px rgba(255,140,0,0.5);
        }

        /* 隱藏真實 Video 與暫存 Canvas */
        #webcam, #hiddenCanvas { display: none; }

        /* 渲染畫面容器 */
        .preview-box {
            position: relative;
            border: 2px solid #333; border-radius: 8px;
            overflow: hidden; background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
        }

        /* ASCII 模式畫布 */
        #asciiOutput {
            font-family: "Courier New", Courier, monospace;
            white-space: pre; line-height: 0.65; font-size: 8px;
            letter-spacing: 1px; color: #00ff66; background: #000;
            padding: 15px; font-weight: bold; user-select: none;
            display: block; margin: 0;
        }

        /* GameBoy 模式畫布 */
        #pixelCanvas {
            image-rendering: pixelated; /* 保持像素風格不模糊 */
            display: none;
        }

        /* 控制面板 */
        .controls {
            margin-top: 25px; display: flex; gap: 15px;
            flex-wrap: wrap; justify-content: center; align-items: center;
        }

        .btn {
            background: #1a1a1a; border: 1px solid #444; color: #ccc;
            padding: 10px 20px; font-size: 0.9rem; cursor: pointer;
            border-radius: 4px; transition: all 0.2s ease;
        }
        .btn:hover { background: #333; color: #fff; border-color: #666; }
        .btn.active { background: #ff8c00; color: #000; border-color: #ff8c00; font-weight: bold; }

        /* 拍攝閃光效果 */
        .flash {
            animation: flashAnim 0.2s ease-out;
        }
        @keyframes flashAnim {
            0% { opacity: 0.3; background: white; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Y2K CAM</h1>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="hiddenCanvas"></canvas>

        <div class="preview-box" id="previewBox">
            <!-- ASCII 模式輸出區 -->
            <pre id="asciiOutput"></pre>
            <!-- GameBoy 模式畫布 -->
            <canvas id="pixelCanvas"></canvas>
        </div>

        <div class="controls">
            <button class="btn active" id="btnAscii" onclick="setMode('ascii')">ASCII 文字風</button>
            <button class="btn" id="btnGameboy" onclick="setMode('gameboy')">GameBoy 綠像素</button>
            <button class="btn" onclick="takeSnapshot()">📷 拍照下載</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        
        const asciiOutput = document.getElementById('asciiOutput');
        const pixelCanvas = document.getElementById('pixelCanvas');
        const pixelCtx = pixelCanvas.getContext('2d');

        let currentMode = 'ascii'; // 'ascii' 或 'gameboy'
        
        // ASCII 密度字元對照表（從暗到亮）
        const asciiChars = ' .:-=+*#%@';
        
        // GameBoy 經典四色盤 (綠色系由暗到亮)
        const gbPalette = [
            [15, 56, 15],     // 濃綠/最暗
            [48, 98, 48],     // 深綠
            [139, 172, 15],   // 淺綠
            [155, 188, 15]    // 明綠/最亮
        ];

        // 1. 初始化攝像頭
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
                    audio: false
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    requestAnimationFrame(processFrame);
                };
            } catch (err) {
                alert("無法存取攝影機，請確保已授權攝影機權限。");
            }
        }

        // 2. 切換模式
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnAscii').classList.toggle('active', mode === 'ascii');
            document.getElementById('btnGameboy').classList.toggle('active', mode === 'gameboy');

            if (mode === 'ascii') {
                asciiOutput.style.display = 'block';
                pixelCanvas.style.display = 'none';
            } else {
                asciiOutput.style.display = 'none';
                pixelCanvas.style.display = 'block';
            }
        }

        // 3. 每訊框影像處理核心邏輯
        function processFrame() {
            if (video.paused || video.ended) return;

            // 設定採樣低解析度 (讓像素化更加明顯)
            const cols = 100;
            const rows = Math.floor(cols * (video.videoHeight / video.videoWidth) * 0.55);

            hiddenCanvas.width = cols;
            hiddenCanvas.height = rows;

            // 鏡頭水平翻轉 (Selfie 視角)
            hiddenCtx.save();
            hiddenCtx.scale(-1, 1);
            hiddenCtx.drawImage(video, -cols, 0, cols, rows);
            hiddenCtx.restore();

            // 取得像素原始 Data
            const imgData = hiddenCtx.getImageData(0, 0, cols, rows);
            const pixels = imgData.data;

            if (currentMode === 'ascii') {
                renderAscii(pixels, cols, rows);
            } else {
                renderGameboy(pixels, cols, rows);
            }

            requestAnimationFrame(processFrame);
        }

        // 4. Render: ASCII 風格
        function renderAscii(pixels, cols, rows) {
            let result = '';
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const idx = (y * cols + x) * 4;
                    const r = pixels[idx];
                    const g = pixels[idx + 1];
                    const b = pixels[idx + 2];

                    const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                    const charIdx = Math.floor((brightness / 255) * (asciiChars.length - 1));
                    result += asciiChars[charIdx];
                }
                result += '\n';
            }
            asciiOutput.textContent = result;
        }

        // 5. Render: GameBoy 綠像素風格 + Y2K 橘色日期時間戳記
        function renderGameboy(pixels, cols, rows) {
            const scale = 6;
            pixelCanvas.width = cols * scale;
            pixelCanvas.height = rows * scale;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const idx = (y * cols + x) * 4;
                    const r = pixels[idx];
                    const g = pixels[idx + 1];
                    const b = pixels[idx + 2];

                    const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                    const colorIdx = Math.floor((brightness / 255) * 3.99);
                    const [gr, gg, gb] = gbPalette[colorIdx];

                    pixelCtx.fillStyle = `rgb(${gr},${gg},${gb})`;
                    pixelCtx.fillRect(x * scale, y * scale, scale, scale);
                }
            }

            // 繪製 Y2K 橘色日期時間戳記
            drawY2KStamp(pixelCtx, pixelCanvas.width, pixelCanvas.height);
        }

        // 6. Y2K 橘色日期時間戳記繪製函數
        function drawY2KStamp(ctx, width, height) {
            const now = new Date();
            const year = String(now.getFullYear()).slice(-2);
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            
            const dateStr = `'${year} ${month} ${day}  ${hours}:${mins}`;
            
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillStyle = '#ff8c00'; // Y2K 經典數位相機橘
            ctx.textAlign = 'right';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(dateStr, width - 20, height - 15);
            ctx.shadowBlur = 0; // 重置 Shadow
        }

        // 7. 一鍵拍照與下載
        function takeSnapshot() {
            const previewBox = document.getElementById('previewBox');
            previewBox.classList.add('flash');
            setTimeout(() => previewBox.classList.remove('flash'), 200);

            const saveCanvas = document.createElement('canvas');
            const saveCtx = saveCanvas.getContext('2d');

            if (currentMode === 'ascii') {
                saveCanvas.width = 800;
                saveCanvas.height = 600;
                saveCtx.fillStyle = '#000000';
                saveCtx.fillRect(0, 0, saveCanvas.width, saveCanvas.height);
                
                saveCtx.fillStyle = '#00ff66';
                saveCtx.font = '12px "Courier New", monospace';
                
                const lines = asciiOutput.textContent.split('\n');
                lines.forEach((line, i) => {
                    saveCtx.fillText(line, 20, 30 + (i * 8));
                });

                // ASCII 模式也加入 Y2K 日期戳記
                drawY2KStamp(saveCtx, saveCanvas.width, saveCanvas.height);
            } else {
                saveCanvas.width = pixelCanvas.width;
                saveCanvas.height = pixelCanvas.height;
                saveCtx.drawImage(pixelCanvas, 0, 0);
            }

            const link = document.createElement('a');
            link.download = `y2k-cam-${Date.now()}.png`;
            link.href = saveCanvas.toDataURL('image/png');
            link.click();
        }

        // 啟動專案
        initCamera();
    </script>
</body>
</html>
