<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <title>Y2K CAM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="mainTitle">Y2K CAM</h1>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="hiddenCanvas"></canvas>
        <canvas id="warpCanvas"></canvas>

        <div class="preview-box" id="previewBox">
            <canvas id="asciiCanvas" aria-label="ASCII camera preview"></canvas>
            <canvas id="pixelCanvas" aria-label="Pixel camera preview"></canvas>
            <div class="timestamp-stamp" id="asciiStamp"></div>
            <div class="record-indicator" id="recordIndicator" aria-hidden="true">● REC</div>
        </div>

        <div class="controls">
            <button class="btn active" id="btnAscii" type="button" onclick="setMode('ascii')">ASCII 文字</button>
            <button class="btn" id="btnPixel" type="button" onclick="setMode('pixel')">8-bit 像素</button>

            <div class="divider"></div>

            <button class="btn active" id="btnGreen" type="button" onclick="setColorTheme('green')">經典綠</button>
            <button class="btn" id="btnMono" type="button" onclick="setColorTheme('mono')">黑白灰階</button>
            <button class="btn" id="btnColor" type="button" onclick="setColorTheme('color')">真實彩色</button>
            <button class="btn" id="btnCcd" type="button" onclick="setColorTheme('ccd')">Y2K CCD</button>
            <button class="btn" id="btnBlackMist" type="button" onclick="toggleBlackMist()">黑柔焦 OFF</button>

            <div class="divider"></div>

            <button class="btn" type="button" onclick="switchCamera()">切換鏡頭</button>
            <button class="btn btn-accent" type="button" onclick="takeSnapshot()">📷 儲存照片</button>
            <button class="btn btn-record" id="recordBtn" type="button" onclick="toggleRecording()">● 錄影</button>
        </div>
    </div>

    <div class="modal" id="photoModal" role="dialog" aria-modal="true" aria-label="照片預覽">
        <img id="photoResult" alt="Snapshot">
        <div class="modal-tip" id="photoTip">長按上方圖片即可「儲存至相簿」，也可以直接分享</div>
        <div class="modal-actions">
            <button class="modal-action" id="sharePhotoBtn" type="button" onclick="shareCurrentPhoto()">分享</button>
            <button class="modal-close" type="button" onclick="closeModal()">關閉</button>
        </div>
    </div>

    <div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-label="錄影預覽">
        <video id="videoResult" controls playsinline></video>
        <div class="modal-tip">錄影完成，可以播放、分享或儲存</div>
        <div class="modal-actions">
            <button class="modal-action" id="shareVideoBtn" type="button" onclick="shareCurrentVideo()">分享</button>
            <a class="modal-action download-link" id="downloadVideoBtn" download="y2k-cam.webm">儲存影片</a>
            <button class="modal-close" type="button" onclick="closeVideoModal()">關閉</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script type="module" src="black-mist.js"></script>
</body>
</html>
