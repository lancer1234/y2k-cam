<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Y2K CAM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #0d0d0d; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .container {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 900px; padding: 15px;
        }

        h1 {
            font-size: 1.5rem; font-weight: 600; letter-spacing: 3px;
            margin: 10px 0 15px 0; color: #ff8c00; text-shadow: 0 0 10px rgba(255,140,0,0.5);
            transition: all 0.3s ease;
        }

        h1.alternate-mode {
            color: #ff0033;
            text-shadow: 0 0 15px rgba(255,0,51,0.8);
            letter-spacing: 5px;
        }

        #webcam, #hiddenCanvas, #warpCanvas { display: none; }

        .preview-box {
            position: relative;
            border: 2px solid #333; border-radius: 8px;
            overflow: hidden; background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            max-width: 100%; max-height: 65vh;
        }

        #asciiWrapper {
            position: relative;
            background: #000;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 65vh;
            overflow: hidden;
        }

        #asciiOutput {
            font-family: "Courier New", Courier, monospace;
            white-space: pre; 
            line-height: 0.55; 
            font-size: 6px; 
            letter-spacing: 0px; 
            margin: 0; 
            font-weight: bold; 
            user-select: none;
            text-align: center;
            color: #00ff66;
            transition: color 0.3s ease;
        }

        .timestamp-stamp {
            position: absolute;
            bottom: 12px;
            right: 15px;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            color: #ff8c00;
            text-shadow: 0 0 4px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        .timestamp-stamp.glitch {
            color: #ff0033;
            text-shadow: 0 0 8px rgba(255,0,0,0.9);
        }

        #pixelCanvas {
            display: none;
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .controls {
            margin-top: 15px; display: flex; gap: 6px;
            flex-wrap: wrap; justify-content: center; align-items: center;
            width: 100%;
        }

        .btn {
            background: #1a1a1a; border: 1px solid #444; color: #ccc;
            padding: 8px 12px; font-size: 0.85rem; cursor: pointer;
            border-radius: 4px; transition: all 0.2s ease;
        }
        .btn:hover { background: #333; color: #fff; border-color: #666; }
        .btn.active { background: #ff8c00; color: #000; border-color: #ff8c00; font-weight: bold; }
        
        .divider {
            width: 1px; height: 20px; background: #444; margin: 0 4px;
        }

        .flash { animation: flashAnim 0.2s ease-out; }
        @keyframes flashAnim {
            0% { opacity: 0.3; background: white; }
            100% { opacity: 1; }
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background: rgba(0,0,0,0.9);
            z-index: 999; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal img {
            max-width: 90%; max-height: 70vh; border: 2px solid #ff8c00;
            border-radius: 6px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .modal-tip {
            margin-top: 15px; color: #ff8c00; font-size: 0.9rem; text-align: center;
        }
        .modal-close {
            margin-top: 15px; background: #333; border: 1px solid #666; color: white;
            padding: 8px 20px; border-radius: 4px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="mainTitle">Y2K CAM</h1>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="hiddenCanvas"></canvas>
        <canvas id="warpCanvas"></canvas>

        <div class="preview-box" id="previewBox">
            <div id="asciiWrapper">
                <pre id="asciiOutput"></pre>
                <div class="timestamp-stamp" id="asciiStamp"></div>
            </div>
            <canvas id="pixelCanvas"></canvas>
        </div>

        <div class="controls">
            <button class="btn active" id="btnAscii" onclick="setMode('ascii')">ASCII 文字</button>
            <button class="btn" id="btnPixel" onclick="setMode('pixel')">8-bit 像素</button>
            
            <div class="divider"></div>

            <button class="btn active" id="btnGreen" onclick="setColorTheme('green')">經典綠</button>
            <button class="btn" id="btnMono" onclick="setColorTheme('mono')">黑白灰階</button>
            <button class="btn" id="btnColor" onclick="setColorTheme('color')">真實彩色</button>
            
            <div class="divider"></div>

            <button class="btn" onclick="switchCamera()">切換鏡頭</button>
            <button class="btn" onclick="takeSnapshot()" style="border-color: #ff8c00; color: #ff8c00;">📷 儲存照片</button>
        </div>
    </div>

    <div class="modal" id="photoModal">
        <img id="photoResult" alt="Snapshot">
        <div class="modal-tip">長按上方圖片即可「儲存至相簿」或分享</div>
        <button class="modal-close" onclick="closeModal()">關閉</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

        const warpCanvas = document.getElementById('warpCanvas');
        const warpCtx = warpCanvas.getContext('2d', { willReadFrequently: true });
        
        const asciiWrapper = document.getElementById('asciiWrapper');
        const asciiOutput = document.getElementById('asciiOutput');
        const asciiStamp = document.getElementById('asciiStamp');
        const pixelCanvas = document.getElementById('pixelCanvas');
        const pixelCtx = pixelCanvas.getContext('2d');

        let currentMode = 'ascii';
        let colorTheme = 'green';
        let facingMode = 'user';
        let currentStream = null;

        let switchCount = 0;
        let isAlternateMode = false;
        let faceLandmarker = null;
        
        let faceParams = {
            mx: 0.5, my: 0.65,
            leftX: 0.38, leftY: 0.62,
            rightX: 0.62, rightY: 0.62,
            leftEyeX: 0.4, leftEyeY: 0.42,
            rightEyeX: 0.6, rightEyeY: 0.42,
            openFactor: 1.0
        };
        let isDetecting = false;

        const asciiChars = ' .`^\",:;Il!i~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
        const gbPalette = [[15, 56, 15], [48, 98, 48], [139, 172, 15], [155, 188, 15]];
        const monoPalette = [[10, 10, 10], [80, 80, 80], [160, 160, 160], [240, 240, 240]];

        async function initFaceLandmarker() {
            try {
                const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
                const filesetResolver = await vision.FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );
                faceLandmarker = await vision.FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numFaces: 1
                });
            } catch (e) {}
        }

        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            setMode(currentMode);
            setColorTheme(colorTheme);

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: facingMode },
                    audio: false
                });
                video.srcObject = currentStream;
                await video.play();
                
                requestAnimationFrame(processFrame);
            } catch (err) {
                console.error(err);
                alert("無法存取攝影機。");
            }
        }

        function switchCamera() {
            switchCount++;
            
            if (switchCount % 3 === 0) {
                isAlternateMode = true;
                document.getElementById('mainTitle').classList.add('alternate-mode');
                asciiStamp.classList.add('glitch');
            } else {
                isAlternateMode = false;
                document.getElementById('mainTitle').classList.remove('alternate-mode');
                asciiStamp.classList.remove('glitch');
                facingMode = (facingMode === 'user') ? 'environment' : 'user';
                initCamera();
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnAscii').classList.toggle('active', mode === 'ascii');
            document.getElementById('btnPixel').classList.toggle('active', mode === 'pixel');

            if (mode === 'ascii') {
                asciiWrapper.style.display = 'block';
                pixelCanvas.style.display = 'none';
            } else {
                asciiWrapper.style.display = 'none';
                pixelCanvas.style.display = 'block';
            }
        }

        function setColorTheme(theme) {
            colorTheme = theme;
            document.getElementById('btnGreen').classList.toggle('active', theme === 'green');
            document.getElementById('btnMono').classList.toggle('active', theme === 'mono');
            document.getElementById('btnColor').classList.toggle('active', theme === 'color');

            if (theme === 'green') {
                asciiOutput.style.color = '#00ff66';
            } else if (theme === 'mono') {
                asciiOutput.style.color = '#e0e0e0';
            }
        }

        async function runFaceDetection() {
            if (!faceLandmarker || video.paused || video.ended || isDetecting) return;
            isDetecting = true;

            try {
                const results = faceLandmarker.detectForVideo(video, performance.now());
                if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                    const lm = results.faceLandmarks[0];
                    const getX = (p) => (facingMode === 'user') ? (1 - p.x) : p.x;

                    const mouthX = (getX(lm[13]) + getX(lm[14])) / 2;
                    const mouthY = (lm[13].y + lm[14].y) / 2;
                    
                    const lx = getX(lm[78]);
                    const ly = lm[78].y;
                    const rx = getX(lm[308]);
                    const ry = lm[308].y;

                    const ley = (lm[159].y + lm[145].y) / 2;
                    const lex = getX(lm[33]);
                    const rey = (lm[386].y + lm[374].y) / 2;
                    const rex = getX(lm[362]);

                    const gap = Math.hypot(lm[14].x - lm[13].x, lm[14].y - lm[13].y);

                    faceParams.mx = faceParams.mx * 0.8 + mouthX * 0.2;
                    faceParams.my = faceParams.my * 0.8 + mouthY * 0.2;
                    faceParams.leftX = faceParams.leftX * 0.8 + lx * 0.2;
                    faceParams.leftY = faceParams.leftY * 0.8 + ly * 0.2;
                    faceParams.rightX = faceParams.rightX * 0.8 + rx * 0.2;
                    faceParams.rightY = faceParams.rightY * 0.8 + ry * 0.2;
                    
                    faceParams.leftEyeX = faceParams.leftEyeX * 0.8 + lex * 0.2;
                    faceParams.leftEyeY = faceParams.leftEyeY * 0.8 + ley * 0.2;
                    faceParams.rightEyeX = faceParams.rightEyeX * 0.8 + rex * 0.2;
                    faceParams.rightEyeY = faceParams.rightEyeY * 0.8 + rey * 0.2;

                    faceParams.openFactor = faceParams.openFactor * 0.8 + Math.max(1.0, gap * 25.0) * 0.2;
                }
            } catch (e) {}

            isDetecting = false;
        }

        function processFrame() {
            if (video.paused || video.ended) return;

            const videoAspect = video.videoHeight / video.videoWidth;
            let cols, rows;

            if (currentMode === 'ascii') {
                cols = 85;
                // 修正重點：把 Courier New 字型約 0.55 的寬高比帶入補償，擺脫寬胖臉！
                const fontAspect = 0.55;
                rows = Math.floor((cols * videoAspect) / fontAspect);
            } else {
                cols = 140;
                rows = Math.floor(cols * videoAspect);
            }

            hiddenCanvas.width = cols;
            hiddenCanvas.height = rows;

            hiddenCtx.save();
            if (facingMode === 'user') {
                hiddenCtx.scale(-1, 1);
                hiddenCtx.drawImage(video, -cols, 0, cols, rows);
            } else {
                hiddenCtx.drawImage(video, 0, 0, cols, rows);
            }
            hiddenCtx.restore();

            if (isAlternateMode) {
                runFaceDetection();
                applyCheshireSmileWarp(cols, rows);
            }

            const targetCanvas = isAlternateMode ? warpCanvas : hiddenCanvas;
            const imgData = targetCanvas.getContext('2d').getImageData(0, 0, cols, rows);

            if (currentMode === 'ascii') {
                renderAscii(imgData.data, cols, rows);
                updateY2KStampText(asciiStamp);
            } else {
                renderPixelArt(imgData.data, cols, rows);
            }

            requestAnimationFrame(processFrame);
        }

        function applyCheshireSmileWarp(cols, rows) {
            warpCanvas.width = cols;
            warpCanvas.height = rows;

            const srcData = hiddenCtx.getImageData(0, 0, cols, rows);
            const dstData = warpCtx.createImageData(cols, rows);
            const srcPixels = srcData.data;
            const dstPixels = dstData.data;

            const mx = faceParams.mx * cols;
            const my = faceParams.my * rows;

            const lx = faceParams.leftX * cols;
            const ly = faceParams.leftY * rows;
            const rx = faceParams.rightX * cols;
            const ry = faceParams.rightY * rows;

            const lex = faceParams.leftEyeX * cols;
            const ley = faceParams.leftEyeY * rows;
            const rex = faceParams.rightEyeX * cols;
            const rey = faceParams.rightEyeY * rows;

            const mouthWidth = Math.hypot(rx - lx, ry - ly) || cols * 0.3;
            const mouthRadius = mouthWidth * 1.1;
            const eyeRadius = mouthWidth * 0.45;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let srcX = x;
                    let srcY = y;

                    const dMouthX = x - mx;
                    const dMouthY = y - my;
                    const distMouth = Math.hypot(dMouthX, dMouthY);

                    if (distMouth < mouthRadius) {
                        const w = Math.exp(-Math.pow(distMouth / (mouthRadius * 0.55), 2));
                        const normX = Math.max(-1.0, Math.min(1.0, dMouthX / (mouthWidth * 0.5)));

                        const curveShiftY = (1.2 - 2.8 * Math.pow(normX, 2)) * (mouthWidth * 0.28);
                        srcY -= curveShiftY * w;

                        if (Math.abs(normX) > 0.4) {
                            srcX -= Math.sign(dMouthX) * (mouthWidth * 0.15) * w;
                        }
                    }

                    const distLeftEye = Math.hypot(x - lex, y - ley);
                    if (distLeftEye < eyeRadius) {
                        const wEye = 0.5 * (1.0 + Math.cos(Math.PI * distLeftEye / eyeRadius));
                        srcX -= (x - lex) * 0.35 * wEye;
                        srcY -= (y - ley) * 0.35 * wEye;
                    }

                    const distRightEye = Math.hypot(x - rex, y - rey);
                    if (distRightEye < eyeRadius) {
                        const wEye = 0.5 * (1.0 + Math.cos(Math.PI * distRightEye / eyeRadius));
                        srcX -= (x - rex) * 0.35 * wEye;
                        srcY -= (y - rey) * 0.35 * wEye;
                    }

                    srcX = Math.max(0, Math.min(cols - 1, Math.round(srcX)));
                    srcY = Math.max(0, Math.min(rows - 1, Math.round(srcY)));

                    const srcIdx = (srcY * cols + srcX) * 4;
                    const dstIdx = (y * cols + x) * 4;

                    dstPixels[dstIdx] = srcPixels[srcIdx];
                    dstPixels[dstIdx + 1] = srcPixels[srcIdx + 1];
                    dstPixels[dstIdx + 2] = srcPixels[srcIdx + 2];
                    dstPixels[dstIdx + 3] = 255;
                }
            }
            warpCtx.putImageData(dstData, 0, 0);
        }

        function renderAscii(pixels, cols, rows) {
            if (colorTheme === 'color') {
                let htmlResult = '';
                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const idx = (y * cols + x) * 4;
                        const r = pixels[idx];
                        const g = pixels[idx + 1];
                        const b = pixels[idx + 2];
                        const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                        const charIdx = Math.floor((brightness / 255) * (asciiChars.length - 1));
                        const ch = asciiChars[charIdx] === ' ' ? '&nbsp;' : asciiChars[charIdx];
                        htmlResult += `<span style="color:rgb(${r},${g},${b})">${ch}</span>`;
                    }
                    htmlResult += '<br>';
                }
                asciiOutput.innerHTML = htmlResult;
            } else {
                let result = '';
                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const idx = (y * cols + x) * 4;
                        const brightness = 0.299 * pixels[idx] + 0.587 * pixels[idx + 1] + 0.114 * pixels[idx + 2];
                        const charIdx = Math.floor((brightness / 255) * (asciiChars.length - 1));
                        result += asciiChars[charIdx];
                    }
                    result += '\n';
                }
                asciiOutput.textContent = result;
            }
        }

        function renderPixelArt(pixels, cols, rows) {
            const scale = 4;
            pixelCanvas.width = cols * scale;
            pixelCanvas.height = rows * scale;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const idx = (y * cols + x) * 4;
                    const r = pixels[idx];
                    const g = pixels[idx + 1];
                    const b = pixels[idx + 2];

                    if (colorTheme === 'color') {
                        const qr = Math.floor(r / 64) * 85;
                        const qg = Math.floor(g / 64) * 85;
                        const qb = Math.floor(b / 64) * 85;
                        pixelCtx.fillStyle = `rgb(${qr},${qg},${qb})`;
                    } else {
                        const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                        const colorIdx = Math.floor((brightness / 255) * 3.99);
                        const palette = (colorTheme === 'green') ? gbPalette : monoPalette;
                        const [pr, pg, pb] = palette[colorIdx];
                        pixelCtx.fillStyle = `rgb(${pr},${pg},${pb})`;
                    }

                    pixelCtx.fillRect(x * scale, y * scale, scale, scale);
                }
            }

            drawY2KStampOnCanvas(pixelCtx, pixelCanvas.width, pixelCanvas.height);
        }

        function getY2KTimeString() {
            if (isAlternateMode) {
                const glitchArr = ["'99 12 31  23:59", "'66 06 06  06:66", "'?? ?? ??  ??:??", "'99 99 99  99:99"];
                if (Math.random() < 0.3) {
                    return glitchArr[Math.floor(Math.random() * glitchArr.length)];
                }
                return `'${Math.floor(Math.random()*90+10)} ${Math.floor(Math.random()*90+10)} ${Math.floor(Math.random()*90+10)}  ${Math.floor(Math.random()*90+10)}:${Math.floor(Math.random()*90+10)}`;
            }

            const now = new Date();
            const year = String(now.getFullYear()).slice(-2);
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            return `'${year} ${month} ${day}  ${hours}:${mins}`;
        }

        function updateY2KStampText(element) {
            element.textContent = getY2KTimeString();
        }

        function drawY2KStampOnCanvas(ctx, width, height) {
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillStyle = isAlternateMode ? '#ff0033' : '#ff8c00';
            ctx.textAlign = 'right';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(getY2KTimeString(), width - 15, height - 12);
            ctx.shadowBlur = 0;
        }

        function takeSnapshot() {
            const previewBox = document.getElementById('previewBox');
            previewBox.classList.add('flash');
            setTimeout(() => previewBox.classList.remove('flash'), 200);

            let dataUrl = '';

            if (currentMode === 'ascii') {
                const saveCanvas = document.createElement('canvas');
                const saveCtx = saveCanvas.getContext('2d');

                const cols = hiddenCanvas.width;
                const rows = hiddenCanvas.height;
                
                const charWidth = 6;
                const lineHeight = 3.6;
                const pad = 15;

                saveCanvas.width = cols * charWidth + (pad * 2);
                saveCanvas.height = rows * lineHeight + (pad * 2);

                saveCtx.fillStyle = '#000000';
                saveCtx.fillRect(0, 0, saveCanvas.width, saveCanvas.height);
                saveCtx.font = 'bold 7px "Courier New", monospace';

                const targetCanvas = isAlternateMode ? warpCanvas : hiddenCanvas;
                const imgData = targetCanvas.getContext('2d').getImageData(0, 0, cols, rows);
                const pixels = imgData.data;

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const idx = (y * cols + x) * 4;
                        const r = pixels[idx];
                        const g = pixels[idx + 1];
                        const b = pixels[idx + 2];
                        const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                        const charIdx = Math.floor((brightness / 255) * (asciiChars.length - 1));
                        const ch = asciiChars[charIdx];

                        if (colorTheme === 'color') {
                            saveCtx.fillStyle = `rgb(${r},${g},${b})`;
                        } else if (colorTheme === 'green') {
                            saveCtx.fillStyle = '#00ff66';
                        } else {
                            saveCtx.fillStyle = '#e0e0e0';
                        }

                        saveCtx.fillText(ch, pad + (x * charWidth), pad + (y * lineHeight));
                    }
                }

                drawY2KStampOnCanvas(saveCtx, saveCanvas.width, saveCanvas.height);
                dataUrl = saveCanvas.toDataURL('image/png');
            } else {
                dataUrl = pixelCanvas.toDataURL('image/png');
            }

            document.getElementById('photoResult').src = dataUrl;
            document.getElementById('photoModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.remove('show');
        }

        initFaceLandmarker();
        initCamera();
    </script>
</body>
</html>
